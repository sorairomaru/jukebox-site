<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jukebox Control</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="send-container">

<h2>YouTube URL送信</h2>

<input id="url" placeholder="https://youtube.com/...">
<button onclick="send()">キューに追加</button>
<button onclick="once_send()">上書き再生</button>

<button onclick="openPlaylistManager()">プレイリスト管理</button>

<button onclick="reload()">再読み込み</button>

<!-- <button onclick="skip()">スキップ</button> -->

<h2>Loop</h2>
<div>
<button onclick="toggleLoop()">ループ切替</button>
<span id="loopStatus">none</span>
</div>
  
<h2>Queue</h2>
<ul id="queue"></ul>

<h2>History</h2>
<ul id="history"></ul>
  
</div>

  
<div id="playlistModal" class="modal" style="display:none">

<h2>プレイリスト管理</h2>

<input id="playlistName" placeholder="保存名">

<button onclick="savePlaylist()">現在のキューをプレイリスト登録</button>

<h3>プレイリスト一覧</h3>

<ul id="playlistList"></ul>

<button onclick="closePlaylistManager()">閉じる</button>

</div>

  
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="control.js"></script>

</body>
</html>
