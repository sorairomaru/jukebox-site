<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jukebox Control</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="send-container">

<h2>YouTube URL</h2>

<input id="url" placeholder="動画URL">
<div style="margin-top:5px">
  <button onclick="send()">キューに追加</button>
  <button onclick="once_send()">即時再生(キュー追加なし)</button>
</div>
  
<!--  -->
<h2>再生管理</h2>
  
<div style="margin-top:5px">
  <button onclick="reload()">再読み込み</button>
  <button onclick="skip()">スキップ</button>
  <button onclick="toggleLoop()">ループ切替</button>
  <span id="loopStatus">none</span>
</div>

<!--  -->
  
<h2>キュー管理</h2>
    
<button onclick="openPlaylistManager()">プレイリスト</button>
<div id="playlistModal" class="modal" style="display:none">
  <div class="modal-content">     
    <h2>プレイリスト</h2>  
    <input id="playlistName" placeholder="保存名"> 
    <button onclick="savePlaylist()">現在のキューをプレイリスト登録</button> 
    <h3>プレイリスト一覧</h3>  
    <ul id="playlistList"></ul> 
    <button onclick="closePlaylistManager()">閉じる</button>
  </div>
</div>
  
<ul id="queue"></ul>

<h2>再生履歴</h2>
<ul id="history"></ul>
  
</div>


  
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="control.js"></script>

</body>
</html>
